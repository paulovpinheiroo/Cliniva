app = "cliniva-backend"
primary_region = "gru"
vm.size = "shared-cpu-1x"
vm.memory = "512mb"

kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

# Segredos (defina com: fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... SUPABASE_JWT_SECRET=...)
# Banco: fly secrets set SPRING_DATASOURCE_URL=jdbc:postgresql://... SPRING_DATASOURCE_USER=... SPRING_DATASOURCE_PASSWORD=...
# CORS: fly secrets set CLINIVA_CORS_ORIGIN=<url do frontend na Vercel>

[env]
  JAVA_MEMORY_OPTS = ""

[[http_service]]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health"