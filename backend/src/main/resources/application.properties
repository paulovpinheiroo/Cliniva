spring.application.name=cliniva
# porta do container: Render injeta PORT; local cai no 8080
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cliniva}
spring.datasource.username=${SPRING_DATASOURCE_USER:cliniva}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cliniva}

# schema gerenciado pelas migrations do Supabase (supabase/migrations/).
# O Hibernate em validate apenas confere se as colunas existem.
spring.jpa.hibernate.ddl-auto=validate

# segurança: Supabase Auth (JWKS) e origens permitidas no CORS
cliniva.supabase.url=${SUPABASE_URL:}
cliniva.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
cliniva.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
cliniva.cors-origin=${CLINIVA_CORS_ORIGIN:http://localhost:5173}

# resumo do dia com IA: provider vazio = sem chamadas externas (cai no template)
cliniva.llm.provider=${LLM_PROVIDER:}
cliniva.llm.gemini.api-key=${LLM_GEMINI_API_KEY:}
cliniva.llm.gemini.model=${LLM_GEMINI_MODEL:gemini-2.0-flash}
cliniva.llm.groq.api-key=${LLM_GROQ_API_KEY:}
cliniva.llm.groq.model=${LLM_GROQ_MODEL:llama-3.3-70b-versatile}